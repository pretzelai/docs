<svg viewBox="0 0 520 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: two concentric rings with gaps -->
  <g stroke="#0A0A0A" stroke-width="10" stroke-linecap="butt" fill="none" transform="translate(55, 60)">
    <circle cx="0" cy="0" r="44"
            stroke-dasharray="266.4 12"
            stroke-dashoffset="-6"
            transform="rotate(-60 0 0)" />
    <circle cx="0" cy="0" r="24"
            stroke-dasharray="138.8 12"
            stroke-dashoffset="-6"
            transform="rotate(120 0 0)" />
  </g>
  <!-- Wordmark -->
  <text x="115" y="76" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">Cord</text>
</svg>
