<svg viewBox="0 0 600 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: two concentric rings with gaps -->
  <g stroke="#0A0A0A" stroke-width="8" stroke-linecap="butt" fill="none" transform="translate(60, 60)">
    <circle cx="0" cy="0" r="36"
            stroke-dasharray="216.195 10"
            stroke-dashoffset="-5"
            transform="rotate(-60 0 0)" />
    <circle cx="0" cy="0" r="20"
            stroke-dasharray="115.664 10"
            stroke-dashoffset="-5"
            transform="rotate(120 0 0)" />
  </g>
  <!-- Wordmark -->
  <text x="115" y="73" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">Cord</text>
</svg>
